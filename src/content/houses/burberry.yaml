trademarkNotice: |
  BURBERRY is a trademark of Burberry Limited, used here for
  identification under nominative fair use. The
  <em>Equestrian Knight</em> figurative mark — the armoured rider
  carrying a lance with the legend <em>Prorsum</em> — is omitted,
  as it is not in the public domain and falls outside the
  PD-textlogo / PD-shape thresholds that cover plain wordmarks. The
  house's checked trade dress is likewise referenced in prose only;
  no recognisable check pattern is rendered on the page. Hex values
  are approximations for editorial illustration; no Pantone licensing
  implied.

milestones:
  - year: 1879
    text: Thomas Burberry invents <em>gabardine</em> — a tightly woven, weatherproofed worsted that breathes where rubberised mackintosh does not. Patented 1888.
  - year: 1891
    text: Opening of the Haymarket shop in London, which remains the house's flagship address.
  - year: 1901
    text: Adoption of the <em>Equestrian Knight</em> figurative mark, with the Latin motto <em>Prorsum</em> ("forwards"), following a public design competition.
  - year: 1912
    text: Patent of the <em>Tielocken</em>, the precursor to the trench coat — a belted, double-breasted gabardine officer's coat without buttons at the front.
  - year: 1914–1918
    text: The trench coat proper is developed and supplied to British officers during the First World War; D-rings, storm flap, gun flap, and epaulettes are introduced as functional details.
  - year: c.1924
    text: The camel-black-red-white check is introduced as a coat lining and only later migrates outwards to become a recognised house signature.
  - year: 1955
    text: Royal Warrant granted by Queen Elizabeth II as outfitters; a second Warrant from the Prince of Wales follows in 1989.
  - year: 2001–2018
    text: <strong>Christopher Bailey</strong>'s tenure — first as design director, then chief creative officer and briefly chief executive — repositions the house as a global luxury brand and pioneers the live-streamed runway.
  - year: 2018–2022
    text: <strong>Riccardo Tisci</strong> serves as chief creative officer, introducing a new monogram and a sharper, streetwear-inflected silhouette.
  - year: 2022
    text: <strong>Daniel Lee</strong>, formerly of Bottega Veneta, is named chief creative officer and shows his first collection in February 2023, returning the house to its British outerwear and equestrian codes.
  - year: 2024
    text: <strong>Joshua Schulman</strong> is appointed chief executive in July, succeeding Jonathan Akeroyd amid a strategic reset toward classic Burberry codes.

creativeDirector: |
  Chief creative officer: <strong>Daniel Lee</strong>, since
  October 2022. Chief executive: <strong>Joshua Schulman</strong>,
  since July 2024 (succeeding Jonathan Akeroyd). Burberry Group plc
  is publicly listed on the London Stock Exchange (ticker BRBY) and
  is a constituent of the FTSE indices. Verify current
  appointments — figures correct as of late 2025.

volatileNote: Volatile fields — verify creative-director, CEO, and listing details against fresh sources before publishing; Burberry's leadership has changed several times in recent seasons.

