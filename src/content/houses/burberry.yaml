founding: |
  Founded in 1856 in Basingstoke, Hampshire by
  <strong>Thomas Burberry</strong> (1835–1926), a 21-year-old
  draper's apprentice. The shop opened as an outfitter specialising in
  outdoor and sporting dress, and would later relocate its headquarters
  to the Haymarket in London as the business expanded.

