designDna: |
  An architectural femininity inherited from the founder — the
  cinched waist, the rounded shoulder, the bell-skirt and the
  pencil-line. Codes recur across decades: the <em>cannage</em>
  caning motif lifted from the Napoleon III chairs of the Avenue
  Montaigne salon; lily-of-the-valley as the founder's lucky
  flower; gris Dior, ivory, and a couture black; toile de Jouy
  reissued in successive variations; and a long romance with the
  <em>tailleur Bar</em> as the silhouette every successor must
  reckon with.

signatureIntro: A reason to exist beyond a timeline — the pieces that made Dior Dior.

signaturePieces:
  - name: The Bar suit
    year: 1947
    text: |
      The cream shantung jacket with rounded, padded hips over a
      pleated black wool skirt — the founding gesture of the
      <em>New Look</em> and the silhouette every later creative
      director has had to reinterpret. <em>Harper's Bazaar</em>'s
      Carmel Snow supplied the name on the spot: <em>"It's such a
      new look."</em>

  - name: Miss Dior
    year: 1947
    text: |
      The house's first fragrance, a green chypre composed by Jean
      Carles and Paul Vacher, named after the founder's sister
      Catherine — a Resistance fighter deported to Ravensbrück.
      The scent has been reformulated and rebottled across decades
      while keeping its place as a Dior cornerstone.

  - name: J'adore
    year: 1999
    text: |
      The amber-floral fragrance composed by Calice Becker in a
      gold-collared amphora flacon — the commercial juggernaut
      that, with successive Charlize Theron campaigns, became one
      of the best-selling women's perfumes in the world.

  - name: Lady Dior bag
    year: 1995
    text: |
      The <em>cannage</em>-quilted top-handle bag — originally
      called the <em>Chouchou</em> — gifted to the
      <strong>Princess of Wales</strong> by Bernadette Chirac and
      so closely associated with her that the house renamed it in
      her honour in 1996. Its charm-strung "D-I-O-R" letters and
      structured silhouette made it the template for the modern
      It-bag.

  - name: Saddle bag
    year: 1999
    text: |
      Galliano's asymmetric, stirrup-clasped shoulder bag —
      retired in the late 2000s, then reissued by Maria Grazia
      Chiuri in 2018 to a generation that had only known it from
      <em>Sex and the City</em> reruns.

  - name: Book Tote
    year: 2018
    text: |
      Chiuri's oversized canvas tote, rendered in successive
      embroidered toile de Jouy, monogram, and cannage variations
      — a workaday silhouette absorbed into the couture
      vocabulary.

  - name: Sauvage
    year: 2015
    text: |
      The men's fragrance composed by François Demachy and
      fronted by Johnny Depp — the commercial anchor of the
      Parfums Christian Dior business in the 2010s and 2020s.

  - name: <em>Dior and I</em>
    year: 2014
    text: |
      Frédéric Tcheng's documentary on Raf Simons's first couture
      collection — a rare on-record portrait of the
      petites mains and the eight-week compression of an haute
      couture studio at work.

marketPositioning: |
  Ultra-luxury. Dior sits at the apex of LVMH's fashion and
  leather goods portfolio alongside Louis Vuitton, with pricing
  and distribution calibrated to couture-house credibility and a
  global fragrance-and-beauty business of exceptional scale.

businessScale: |
  Christian Dior Couture reported revenues of approximately
  €9.5 billion in recent years (per LVMH-published segment figures,
  2023–2024); Parfums Christian Dior is one of the largest selective
  fragrance and beauty businesses in the world. Figures move; verify
  against LVMH's latest published accounts before citing.

culturalImpact: |
  The <em>New Look</em> is the most-cited single collection in
  twentieth-century fashion — the moment a designer is widely
  credited with restoring Paris's post-war centrality. Dior's
  successors made the house a generational stage: Saint Laurent's
  Trapèze, Bohan's long stewardship of bourgeois elegance,
  Galliano's historicist couture, Simons's modernist reset, and
  Chiuri's reframing of the codes through an explicitly feminist
  lens. The house has anchored cinema, dance, and contemporary art
  collaborations through the <em>Lady Dior As Seen By</em> and
  <em>Dior Lady Art</em> programmes, and remains a fixture of red-
  carpet and royal dressing on both sides of the Atlantic.

