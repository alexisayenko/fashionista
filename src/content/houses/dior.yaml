name: Dior
city: Paris
country: France
countryCode: fr
founded: 1946

founding: |
  Founded in December 1946 at <strong>30 avenue Montaigne</strong>,
  Paris, by <strong>Christian Dior</strong> (1905–1957), with
  financial backing from textile industrialist
  <strong>Marcel Boussac</strong>. The first collection — shown on
  12 February 1947 — was christened the <em>New Look</em> by
  <em>Harper's Bazaar</em> editor Carmel Snow and reset the
  silhouette of post-war womenswear almost overnight.

