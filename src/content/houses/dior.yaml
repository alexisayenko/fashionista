milestones:
  - year: 1947
    text: The debut collection — soon known as the <em>New Look</em> — introduces the <em>Bar</em> suit, with its rounded shoulders, nipped waist, and full calf-length skirt, in calculated rebuke to wartime austerity.
  - year: 1948
    text: Christian Dior Parfums is established; <em>Miss Dior</em>, launched the previous year, anchors a fragrance arm that becomes central to the house's economics.
  - year: 1957
    text: Christian Dior dies suddenly on 24 October at Montecatini, aged 52; the twenty-one-year-old <strong>Yves Saint Laurent</strong>, his hand-picked assistant, is named successor.
  - year: 1960
    text: <strong>Marc Bohan</strong> takes over after Saint Laurent's military conscription, beginning a steadying twenty-nine-year tenure.
  - year: 1989
    text: <strong>Gianfranco Ferré</strong> succeeds Bohan, bringing an Italian architect's discipline to the house's couture line.
  - year: 1996
    text: <strong>John Galliano</strong> is appointed creative director, ushering in a decade of theatrical, historicist couture and the bag- and logo-led commercial expansion of the 2000s.
  - year: 2011
    text: Galliano is dismissed in March following an antisemitic tirade caught on video in a Paris café; <strong>Bill Gaytten</strong> steers the studio in the interim.
  - year: 2012
    text: <strong>Raf Simons</strong> arrives from Jil Sander and pares the house back to a minimalist, modernist register — chronicled in the documentary <em>Dior and I</em>.
  - year: 2016
    text: <strong>Maria Grazia Chiuri</strong> is named the first woman to lead Dior womenswear, opening her debut collection with the slogan tee <em>"We Should All Be Feminists."</em>
  - year: 2018
    text: <strong>Kim Jones</strong> launches Dior Men, recasting the menswear line through streetwear, art collaborations, and a tighter tailoring proposition.
  - year: 2025
    text: <strong>Jonathan Anderson</strong>, formerly of Loewe, is appointed creative director — first of Dior Men in April, then of womenswear and couture as well in June, becoming the first designer since Christian Dior himself to oversee both.

creativeDirector: |
  Creative director (women's, men's, and couture):
  <strong>Jonathan Anderson</strong>, since June 2025, succeeding
  <strong>Maria Grazia Chiuri</strong> on the women's side and
  <strong>Kim Jones</strong> on men's. The house is owned by
  <strong>Christian Dior SE</strong>, the family holding company of
  <strong>Bernard Arnault</strong>, which controls
  <strong>LVMH Moët Hennessy Louis Vuitton</strong>; Christian Dior
  Couture sits inside the LVMH Fashion & Leather Goods division.

volatileNote: Volatile fields — Anderson's joint womenswear-and-menswear remit was announced in 2025 and the studio organisation is still bedding in; verify creative-director and ownership lines against fresh sources before publishing.

