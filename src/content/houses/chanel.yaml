name: Chanel
city: Paris
country: France
countryCode: fr
founded: 1910

founding: |
  Founded in 1910 in Paris by <strong>Gabrielle "Coco" Chanel</strong>
  (1883–1971), who opened her first millinery boutique at 21 rue Cambon. The
  atelier expanded into clothing through the 1910s and was consolidated as
  the House of Chanel by the early 1920s.

