designDna: |
  Tweed, jersey, and a black-and-white palette punctuated by gilt and
  pearl. The codes are reductive and architectural — the
  collarless cardigan jacket, the unembellished little black dress,
  the camellia, the interlocking-C monogram, costume pearls worn
  with day clothes, and the two-tone slingback — a vocabulary
  built to liberate the body rather than constrain it.

signatureIntro: A reason to exist beyond a timeline — the pieces that made Chanel Chanel.

signaturePieces:
  - name: Chanel N°5
    year: 1921
    figure:
      src: ../../assets/houses/chanel/chanel-no5-bottle.jpg
      alt: Chanel N°5 flacon
      caption: 'The Chanel N°5 flacon · Photo: <a href="https://commons.wikimedia.org/wiki/File:CHANEL_No5_parfum.jpg" rel="noopener">Arz / Wikimedia Commons</a> · Public domain'
    text: |
      The aldehyde-led fragrance composed by Ernest Beaux,
      presented in a stark rectangular flacon often said to draw
      from men's whisky decanters and pharmaceutical glass. Coco
      picked the fifth sample Beaux brought her — the
      eponymous N°5 — and launched it on the fifth of
      May 1921. The first scent to carry a couturier's name, it
      remains, a century on, among the best-selling perfumes in
      the world. Marilyn Monroe's 1952 quip that she wore
      "a few drops of N°5" to bed sealed its
      place in popular culture; the house has since anchored
      the campaign with successive ambassadors from Catherine
      Deneuve to Nicole Kidman.

  - name: The cardigan jacket
    year: 1925–
    text: |
      Collarless, braid-trimmed, weighted with a fine chain at the
      hem so it falls cleanly — the tweed silhouette that
      became shorthand for Parisian dressing.

  - name: The little black dress
    year: 1926
    text: |
      A simple long-sleeved sheath in black crêpe de Chine
      photographed for American <em>Vogue</em>, which compared its
      anonymity and ubiquity to Henry Ford's Model T.

  - name: The 2.55 bag
    year: 1955
    text: |
      A quilted leather shoulder bag with a chain strap that freed
      the wearer's hands — named for February 1955. The
      interlocking-C clasp came later, with Lagerfeld.

  - name: The two-tone slingback
    year: 1957
    text: |
      Beige body, black toe cap. The beige lengthened the leg, the
      black cap shortened the appearance of the foot —
      Coco's rebuke to the all-black court shoe.

  - name: Costume jewellery
    text: |
      Coco's most durable contribution outside dressmaking: she
      popularised non-precious <em>bijoux de fantaisie</em> —
      glass, paste, gilt metal, simulated pearls — and brought
      it into high fashion, establishing its aesthetic value
      independent of intrinsic material worth. She layered ropes of
      fake pearls with tweed in daylight and, just as deliberately,
      mixed costume pieces with real stones so the wearer (and the
      onlooker) could not always tell which was which. The 1932
      <em>Bijoux de Diamants</em> collection was the calculated
      exception that proved the rule.

  - name: Métiers d'Art shows
    year: 2002–
    text: |
      The annual pre-fall production conceived by Lagerfeld to
      showcase the in-house ateliers acquired under
      <em>Paraffection</em> — staged in cities (Edinburgh,
      Dallas, Salzburg, Dakar, Manchester) that frame the codes
      against new contexts.

  - name: The J12 watch
    year: 2000
    text: |
      A high-tech ceramic sports watch in matte black or white
      — a rare instance of the house extending its design
      vocabulary into hard goods on its own terms.

marketPositioning: |
  Ultra-luxury. Chanel commands the highest tier of pricing in
  ready-to-wear and leather goods, anchored by haute couture
  credibility and a beauty-and-fragrance business of global scale.

businessScale: |
  One of the largest privately-held luxury houses in the world, with
  annual revenues reported on the order of nineteen to twenty
  billion US dollars in recent years. Figures move; verify against
  the latest published accounts before citing.

culturalImpact: |
  Coco Chanel reshaped twentieth-century womenswear by replacing
  corsetry with jersey and tailoring borrowed from menswear; the
  house's codes — tweed, pearls, the little black dress
  — are among the most quoted in fashion. Under Lagerfeld,
  Chanel became a benchmark for staged spectacle, with shows set in
  supermarkets, casinos, rocket launches, and recreated street
  scenes inside the Grand Palais. Recent collaborations span
  cinema, ballet (Pharrell Williams's pieces with Paris Opéra
  Ballet costumes), and the visual arts through the
  Métiers d'Art programme.
