milestones:
  - year: 1921
    text: Launch of <em>Chanel N°5</em>, the first fragrance to bear a couturier's name and the bedrock of the house's commercial fortunes.
  - year: 1926
    text: American <em>Vogue</em> publishes the little black dress, calling it "Chanel's Ford" for its inevitability and universality.
  - year: 1932
    text: <em>Bijoux de Diamants</em>, Chanel's only diamond fine-jewellery collection, presented in her own apartment.
  - year: 1939–1954
    text: Couture house shuttered during the Second World War; Coco Chanel returns to design at age 71 with her February 1954 collection.
  - year: 1955
    text: Introduction of the quilted <em>2.55</em> shoulder bag, named for the month and year of its release.
  - year: 1971
    text: Coco Chanel dies on 10 January at the Hotel Ritz, Paris.
  - year: 1983
    text: <strong>Karl Lagerfeld</strong> joins as creative director, beginning a thirty-six-year tenure that modernises the codes without breaking them.
  - year: 2002
    text: Acquisition of artisan ateliers under the <em>Paraffection</em> umbrella (Lesage, Massaro, Lemarié, Goossens, Maison Michel, and others), securing the Métiers d'Art.
  - year: 2019
    text: Lagerfeld dies in February; <strong>Virginie Viard</strong>, his long-time studio director, succeeds him.
  - year: 2024
    text: Viard departs after five years.
  - year: 2025
    text: <strong>Matthieu Blazy</strong>, formerly of Bottega Veneta, is named creative director of fashion.

creativeDirector: |
  Creative director of fashion: <strong>Matthieu Blazy</strong>,
  since 2025. Chanel remains privately held by the
  <strong>Wertheimer family</strong> — brothers Alain and
  Gérard Wertheimer, grandsons of Coco Chanel's original
  business partner Pierre Wertheimer.

