designDna: |
  A house built on the trunk-maker's logic of structure, hardware,
  and surface. The vocabulary is canvas before leather — the
  <em>Toile Monogram</em>, the <em>Damier</em>, the Epi grain —
  paired with brass corners, vachetta-leather trim that ages with
  use, and the brand-name lock developed by Georges Vuitton in
  1890. Under successive designers the silhouette has shifted, but
  the iconography has remained: monogram and travel, repeated as
  the through-line from steamer trunk to runway.

signatureIntro: A reason to exist beyond a timeline — the pieces that made Louis Vuitton Louis Vuitton.

signaturePieces:
  - name: The flat-topped Trianon trunk
    year: 1858
    text: |
      Louis Vuitton's founding object. By replacing the domed lid
      of the traditional travel chest with a flat top in grey
      waterproofed canvas, he made the trunk stackable in a ship's
      hold or a train carriage — and obsolesced an entire
      generation of luggage in the process.

  - name: The Toile Monogram canvas
    year: 1896
    text: |
      Designed by <strong>Georges Vuitton</strong> as an
      anti-counterfeiting device, the LV-and-quatrefoil pattern
      borrowed motifs from the Japonisme then current in Paris and
      registered them as trademarks. The irony is well-rehearsed —
      the most counterfeited mark in luxury was conceived to stop
      counterfeiting — but the canvas remains the visual anchor
      of the house and the platform on which decades of
      collaborations have been staged.

  - name: The Keepall
    year: 1924
    text: |
      A soft, foldable weekend bag introduced as air travel began
      to reshape what people carried. Its proportions and double
      handles became the default for the modern duffel.

  - name: The Noé
    year: 1932
    text: |
      Commissioned, the story goes, by a champagne maison that
      needed to carry five bottles upright; the bucket silhouette
      with a drawstring closure became one of the house's
      enduring shapes.

  - name: The Speedy
    year: 1930
    text: |
      Originally the <em>Express</em> — a smaller, hand-held
      version of the Keepall. Audrey Hepburn requested a
      25-centimetre version in 1965; the <em>Speedy 25</em> has
      been continuously produced ever since.

  - name: The Marc Jacobs collaborations
    year: 2001–2013
    text: |
      Stephen Sprouse's graffiti, Takashi Murakami's
      Multicolore and Cherry Blossom, Richard Prince's Joke
      bags, Yayoi Kusama's polka dots — Jacobs treated the
      monogram canvas as a surface for contemporary art, and in
      doing so rewrote what a heritage luxury house could be in the
      twenty-first century.

  - name: The Capucines
    year: 2013
    text: |
      A structured top-handle bag in plain leather, named for the
      street of the original 1854 store — Ghesquière's
      first signature handbag and a deliberate counterweight to
      the monogram.

  - name: The Pont Neuf show
    year: 2023
    text: |
      <strong>Pharrell Williams</strong>'s debut menswear
      collection, presented on a runway built across the Pont Neuf
      with a gold-plated <em>Damoflage</em> camouflage and a Jay-Z
      and Beyoncé performance — the most-watched men's show
      in the house's history, and a statement about the cultural
      ambit of luxury menswear in the streetwear era.

marketPositioning: |
  Ultra-luxury, mass-distributed. Louis Vuitton sits at the top
  tier of pricing while operating a global retail network on a
  scale matched by few rivals — a hybrid that has defined the
  house's commercial model for three decades.

businessScale: |
  By common reckoning the largest single luxury brand in the
  world by revenue. The Fashion & Leather Goods division of LVMH,
  of which Vuitton is the dominant contributor, reported revenues
  on the order of forty billion euros in recent years
  (per LVMH-released figures, 2023–2024); the house does not
  publish standalone accounts, so figures are estimates derived
  from group disclosures. Verify against the latest published
  reporting before citing.

culturalImpact: |
  Louis Vuitton's monogram canvas is among the most globally
  recognised pieces of design in any category — clothing, art,
  or industrial — and the house has used that recognition as a
  platform for sustained engagement with contemporary art (Sprouse,
  Murakami, Prince, Kusama, Jeff Koons), architecture (the Frank
  Gehry-designed Fondation Louis Vuitton in Paris, opened 2014),
  cinema, music, and sport (the <em>Trophy Trunk</em> commissions
  for the FIFA World Cup, the America's Cup, and Roland-Garros).
  Under the LVMH umbrella, the maison has also become a case study
  in how a nineteenth-century craft business can scale into a
  twenty-first-century cultural institution without — its
  defenders argue — losing the workshop logic of the founder.
