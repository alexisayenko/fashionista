milestones:
  - year: 1858
    text: Introduction of the flat-topped <em>Trianon</em> trunk in grey waterproofed canvas — light, stackable, and the template for modern luggage.
  - year: 1872
    text: 'Launch of the red-and-beige striped canvas, an early counter to the Trianon copyists.'
  - year: 1888
    text: 'Introduction of the <em>Damier</em> chequerboard canvas, registered as a trademark to defend against widespread imitation.'
  - year: 1896
    text: '<strong>Georges Vuitton</strong> creates the <em>Toile Monogram</em> — interlocking LV initials with quatrefoils and flowers — explicitly as an anti-counterfeiting device.'
  - year: 1924
    text: Launch of the <em>Keepall</em>, a soft, foldable weekend bag that anticipated the era of air travel.
  - year: 1932
    text: Launch of the <em>Noé</em>, originally designed to carry five champagne bottles upright.
  - year: 1987
    text: Merger with Moët Hennessy to form <strong>LVMH</strong> — the holding company that would consolidate much of the modern luxury industry.
  - year: 1997
    text: '<strong>Marc Jacobs</strong> appointed artistic director, launching the house''s first ready-to-wear and pulling Vuitton into the contemporary art conversation.'
  - year: 2001
    text: Stephen Sprouse graffiti-printed monogram bags — the first of many art collaborations (Murakami 2003, Richard Prince 2008, Yayoi Kusama 2012 and 2023).
  - year: 2013
    text: '<strong>Nicolas Ghesquière</strong> succeeds Jacobs as artistic director of women''s collections.'
  - year: 2018
    text: '<strong>Virgil Abloh</strong> becomes artistic director of menswear — the first Black designer to lead the men''s line at the house — until his death in November 2021.'
  - year: 2023
    text: '<strong>Pharrell Williams</strong> named men''s creative director, debuting on a runway built across the Pont Neuf in June.'

creativeDirector: |
  As of 2026, women's collections are led by
  <strong>Nicolas Ghesquière</strong> (artistic director since
  2013) and men's collections by <strong>Pharrell Williams</strong>
  (creative director of menswear since 2023). The house is the
  flagship maison of <strong>LVMH Moët Hennessy Louis Vuitton</strong>,
  controlled by the <strong>Arnault family</strong>; chairman and
  CEO Bernard Arnault has overseen the group since 1989.

