name: Louis Vuitton
city: Paris
country: France
countryCode: fr
founded: 1854

founding: |
  Founded in 1854 in Paris by <strong>Louis Vuitton</strong>
  (1821–1892), a layetier-emballeur who had spent years packing
  trunks for Empress Eugénie before opening his own workshop on
  rue Neuve-des-Capucines. His innovation was structural —
  flat-topped, canvas-covered trunks that stacked on the new steam
  liners and railway carriages, replacing the domed leather chests
  of an earlier age.

