founded: 1960

founding: |
  Founded in 1960 in Rome by <strong>Valentino Garavani</strong>
  (b. 1932) with his business and life partner
  <strong>Giancarlo Giammetti</strong>. Garavani had trained in
  Paris under Jean Dessès and Guy Laroche before opening the
  atelier on via Condotti, anchoring the house from the start in
  the language of Roman haute couture.

