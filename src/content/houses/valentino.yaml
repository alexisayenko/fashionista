milestones:
  - year: 1962
    text: Florence debut at the Sala Bianca of Palazzo Pitti establishes Valentino on the international fashion circuit.
  - year: 1968
    text: The <em>Collezione Bianca</em> — an entirely white spring couture collection — becomes the house's most quoted statement and the template for its bridal vocabulary.
  - year: 1968
    text: Jacqueline Kennedy marries Aristotle Onassis on Skorpios in a Valentino dress, sealing the house's transatlantic celebrity reach.
  - year: 1970s
    text: The <em>rosso Valentino</em> — a saturated couture red — emerges as the house's signature shade and a recurring runway leitmotif.
  - year: 1985
    text: Introduction of the <strong>V-logo</strong>, which becomes one of the house's most-recognised identity marks.
  - year: 2007
    text: Valentino Garavani retires after a forty-five-year career, marked by a three-day Rome retrospective.
  - year: 2008
    text: <strong>Maria Grazia Chiuri</strong> and <strong>Pierpaolo Piccioli</strong>, long-time accessories designers at the house, are named co-creative directors.
  - year: 2014
    text: Launch of the <em>Rockstud</em> family of pyramid-studded bags and shoes under Chiuri and Piccioli — the house's defining commercial accessory of the 2010s.
  - year: 2016
    text: Chiuri leaves for Dior; <strong>Pierpaolo Piccioli</strong> continues as sole creative director and recentres the house on couture craft and chromatic boldness.
  - year: 2023
    text: Mayhoola, the Qatari investment vehicle that has owned Valentino since 2012, agrees to sell a thirty-per-cent stake to <strong>Kering</strong>, with an option for the French group to take full control by 2028.
  - year: 2024
    text: Piccioli departs in March after sixteen years at the house; <strong>Alessandro Michele</strong>, formerly of Gucci, is named creative director shortly after.
  - year: 2025
    text: Michele's first full ready-to-wear collections for the house arrive, applying his maximalist vocabulary to the Valentino archive.

creativeDirector: |
  Creative director: <strong>Alessandro Michele</strong>, since
  March 2024, after sixteen years at the helm of Gucci. Valentino
  is majority-owned by <strong>Mayhoola for Investments</strong>
  (Qatar), with <strong>Kering</strong> holding a thirty-per-cent
  minority stake under a 2023 agreement that includes an option
  for full acquisition by 2028.

volatileNote: Volatile fields — verify creative-director and ownership lines against fresh sources before publishing; Michele's tenure and the Kering option are recent and still settling.

