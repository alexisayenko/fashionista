designDna: |
  An Italian-couture sensibility built on the dialogue between
  <em>rosso Valentino</em> and ivory, between cinematic glamour
  and Roman craft. Garavani's vocabulary — sculptural draping,
  ruffled <em>volants</em>, lace, and hand-applied embellishment —
  was reframed under Piccioli into a language of saturated colour
  and modern proportion, then reframed again under Michele as an
  eclectic, archive-mining maximalism. The V-logo and the
  pyramid-studded Rockstud function as the house's most
  recognisable hard-good signatures.

signatureIntro: A reason to exist beyond a timeline — the pieces that made Valentino Valentino.

signaturePieces:
  - name: The <em>Collezione Bianca</em>
    year: 1968
    text: |
      An entirely white spring couture collection — coats, day
      dresses, and evening gowns rendered in ivory, cream, and
      bone. The show became the house's most-quoted statement and
      the foundation of its enduring bridal vocabulary.

  - name: <em>Rosso Valentino</em>
    year: 1959–
    text: |
      The saturated couture red Garavani has described as fixed
      from a single early epiphany at the opera in Barcelona. It
      is less a Pantone reference than a recurring runway
      leitmotif — the colour the house finishes a couture show on,
      worn by Jackie Onassis, Julia Roberts, and the better part
      of three generations of Oscar attendees.

  - name: The V-logo
    year: 1985–
    text: |
      A geometric serif <em>V</em> introduced in the mid-1980s and
      since extended across hardware, buckles, and full-coverage
      monogram canvases — one of the most-recognised identity
      marks in Italian luxury.

  - name: The Rockstud
    year: 2010–
    text: |
      Pyramid metal studs bordering bags, pumps, ballerinas, and
      sandals — the Chiuri-and-Piccioli accessory that became
      shorthand for a certain 2010s wardrobe and, briefly, the
      house's commercial centre of gravity.

  - name: The Roman Stud
    year: 2020–
    text: |
      Piccioli's larger, softer evolution of the Rockstud — a
      maxi-stud quilted-leather shoulder bag introduced under his
      solo direction.

  - name: Piccioli's chromatic couture
    year: 2017–2024
    text: |
      The Pierpaolo Piccioli era is most legible in the
      monochrome-saturated couture shows — pinks, oranges,
      acid greens, and cobalt staged against unadorned
      backdrops — that recentred the house on colour as a
      structural element rather than a finishing touch.

  - name: Valentino Garavani retrospective
    year: 2007
    text: |
      A three-day Rome celebration around Garavani's retirement,
      including a couture show at the Temple of Venus and a
      retrospective exhibition at the Ara Pacis — closing the
      designer's forty-five-year tenure as a public spectacle in
      his adopted city.

marketPositioning: |
  Ultra-luxury. Valentino sits in the top tier of Italian houses
  alongside Prada and Gucci, with haute-couture credibility
  anchoring a ready-to-wear and accessories business priced at
  the upper end of the segment.

businessScale: |
  Annual revenues on the order of one-and-a-half billion euros in
  recent years (per Mayhoola-released figures, 2023), with a
  global retail network and growing direct-operated presence.
  Figures move; verify against the latest published accounts
  before citing.

culturalImpact: |
  Valentino Garavani's wardrobe has dressed the post-war public
  imagination of glamorous European femininity — from Jackie
  Kennedy's wedding to Skorpios in 1968 to decades of red-carpet
  appearances in <em>rosso Valentino</em>. Under Piccioli the
  house became a benchmark for the contemporary couture show as a
  chromatic statement and for an inclusive casting practice that
  reframed a heritage Roman maison for a younger audience. The
  Michele appointment, announced in March 2024, places one of
  the most stylistically distinctive directors of the previous
  decade at the head of the house — its working-out is still
  in progress.

