name: Fendi
city: Rome
country: Italy
countryCode: it
founded: 1925

founding: |
  Founded in 1925 in Rome by <strong>Adele Casagrande</strong>
  (1897–1978) and her husband <strong>Edoardo Fendi</strong>
  (1888–1954) as a small fur-and-leather atelier and shop on Via del
  Plebiscito. Their five daughters — Paola, Anna, Franca, Carla, and
  Alda — entered the business through the 1940s and 1950s and ran
  the house collectively for the better part of half a century.

