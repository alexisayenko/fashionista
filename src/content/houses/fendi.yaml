milestones:
  - year: 1925
    text: Adele and Edoardo Fendi open the original fur-and-leather workshop and boutique in Rome.
  - year: 1946
    text: The five Fendi sisters begin entering the family business; the house's centre of gravity shifts toward modernised fur and accessories.
  - year: 1965
    text: <strong>Karl Lagerfeld</strong> is appointed designer of the fur and ready-to-wear collections, the start of a fifty-four-year tenure that ends only with his death.
  - year: 1965
    text: Lagerfeld and the sisters introduce the interlocking <strong>FF</strong> monogram — nicknamed <em>Zucca</em> — derived from the phrase <em>"Fun Furs."</em>
  - year: 1977
    text: Launch of the first Fendi ready-to-wear collection, extending the house beyond fur and leather goods.
  - year: 1997
    text: <strong>Silvia Venturini Fendi</strong>, granddaughter of the founders, designs the <em>Baguette</em> — a small shoulder bag that becomes the prototype of the modern "It-bag."
  - year: 2001
    text: <strong>LVMH</strong> acquires a controlling stake in Fendi alongside Prada, and by 2003 takes majority ownership; Fendi becomes part of the group's fashion-and-leather-goods division.
  - year: 2005
    text: The house relocates its Rome headquarters to the <em>Palazzo Fendi</em> on the Largo Goldoni; in 2015 it moves the corporate offices to the rationalist <em>Palazzo della Civiltà Italiana</em> in EUR.
  - year: 2019
    text: Karl Lagerfeld dies on 19 February; his final Fendi collection is shown posthumously days later in Milan.
  - year: 2020
    text: <strong>Kim Jones</strong> is appointed artistic director of couture and womenswear, working alongside Silvia Venturini Fendi (accessories and menswear) and Delfina Delettrez Fendi (jewellery).
  - year: 2024
    text: Kim Jones departs in October after roughly four years; the womenswear and couture seat is left vacant pending a successor.

creativeDirector: |
  As of early 2026, the artistic-director seat for womenswear and
  couture remains <strong>vacant</strong> following Kim Jones's exit
  in October 2024. <strong>Silvia Venturini Fendi</strong> continues
  to lead accessories and menswear, and <strong>Delfina Delettrez
  Fendi</strong> oversees jewellery. The house is owned by
  <strong>LVMH Moët Hennessy Louis Vuitton</strong>.

volatileNote: Volatile fields — verify the womenswear / couture appointment and LVMH stake against fresh sources before publishing.

