milestones:
  - year: 1985
    text: Debut as part of the <em>Nuovi Talenti</em> showcase at Milan Fashion Week — the founding moment of the house.
  - year: 1986
    text: First solo women's collection, <em>Real Women</em>, presented in Milan.
  - year: 1989
    text: Launch of the women's lingerie line, foregrounding the corsetry that would become a signature.
  - year: 1990
    text: First menswear collection, extending the Sicilian tailoring vocabulary to men's ready-to-wear.
  - year: 1992
    text: Launch of the debut women's fragrance, <em>Dolce & Gabbana Pour Femme</em>.
  - year: 1993
    text: <strong>Madonna</strong> commissions about 1,500 pieces for her <em>Girlie Show</em> world tour, cementing the house's relationship with the singer and its presence on the international stage.
  - year: 1994
    text: Launch of the <em>D&G</em> diffusion line, aimed at a younger and more accessible audience.
  - year: 2001
    text: <em>Light Blue</em> women's fragrance is introduced; it becomes one of the best-selling perfumes of the 2000s.
  - year: 2011
    text: The D&G diffusion line is discontinued and folded back into the main Dolce & Gabbana label.
  - year: 2012
    text: Launch of <strong>Alta Moda</strong>, the house's haute couture programme for women, presented in evolving Italian locations (Taormina, Portofino, Venice, Syracuse).
  - year: 2013
    text: Launch of <strong>Alta Sartoria</strong>, the men's couture counterpart, foregrounding hand-tailored Italian menswear.
  - year: 2018
    text: A promotional campaign released ahead of a planned Shanghai show, together with private messages attributed to Stefano Gabbana, prompted widespread criticism in China; the show was cancelled and the brand's commercial position in the Chinese market was significantly affected.
  - year: 2025
    text: Domenico Dolce and Stefano Gabbana remain co-creative directors and joint owners — an unusually stable founder-led arrangement among large Italian luxury houses.

creativeDirector: |
  Co-creative directors and co-owners: <strong>Domenico Dolce</strong>
  and <strong>Stefano Gabbana</strong>, since founding in 1985. The
  two have remained jointly at the creative helm continuously,
  through and beyond the end of their personal partnership in 2005
  — an unusually stable creative-director situation by the
  standards of contemporary luxury fashion.

volatileNote: Volatile fields — verify ownership structure and any succession announcements against fresh sources before publishing.

