designDna: |
  Sicilian sensuality reframed as luxury: the black-lace
  widow's dress, the corseted slip, leopard print used as a neutral,
  baroque ornament drawn from Italian Catholic iconography —
  saints, gilded altarpieces, votive imagery — and a tailoring
  vocabulary rooted in mid-century Italian cinema. The codes are
  ornamental and overtly feminine where Armani's are reductive,
  and unapologetically rooted in a single regional culture.

signatureIntro: A reason to exist beyond a timeline — the pieces that made Dolce & Gabbana Dolce & Gabbana.

signaturePieces:
  - name: The Sicilian black-lace dress
    year: 1986–
    text: |
      The slip-cut black-lace dress, often paired with a black
      headscarf and rosary — the founders' transposition of the
      Sicilian widow's mourning wardrobe into eveningwear, and the
      single image most associated with the house's early identity.

  - name: The corset dress
    year: 1990s–
    text: |
      A boned, structured bodice married to a flowing skirt — the
      house's reinvention of mid-century Italian glamour as
      contemporary red-carpet eveningwear, worn by Monica Bellucci,
      Isabella Rossellini, and a generation of actresses afterwards.

  - name: Leopard print
    text: |
      Used as a recurring base rather than an accent — coats,
      dresses, lingerie, accessories — leopard became, in the
      house's hands, a Sicilian neutral on equal footing with black.

  - name: <em>Light Blue</em>
    year: 2001
    text: |
      The Mediterranean-accented women's fragrance composed by
      Olivier Cresp — Sicilian lemon, apple, cedar, bellflower
      — that became one of the best-selling perfumes of the
      2000s and the commercial anchor of the beauty line.

  - name: The Sicily bag
    year: 2009
    text: |
      A trapeze-shaped top-handle bag in textured calfskin, named
      for the founders' shared homeland — the house's
      best-known leather-goods icon.

  - name: Alta Moda
    year: 2012–
    text: |
      The biannual women's couture programme, staged in evolving
      Italian locations — Taormina, Portofino, Venice, Syracuse,
      Alta Badia — that has become as much a tourism event as a
      fashion one, presented to a private clientele alongside Alta
      Sartoria menswear and Alta Gioielleria fine jewellery.

  - name: Tailoring rooted in Italian cinema
    text: |
      Sharp men's suiting and the corseted-yet-fluid women's
      silhouette, drawn explicitly from <em>neorealismo</em> and
      mid-century Italian film — Visconti, Rossellini, the
      wardrobes of Anna Magnani and Sophia Loren — translated
      into contemporary ready-to-wear.

marketPositioning: |
  Ultra-luxury at the ornamental, maximalist end of the Italian
  luxury spectrum — a deliberate counterweight to the Milanese
  minimalism associated with Armani and Prada. Pricing across
  ready-to-wear, leather goods, and Alta Moda couture sits at the
  highest tier of the market.

businessScale: |
  The Dolce & Gabbana group generates annual revenues on the order
  of €1.5–2 billion in recent reporting years, with a vertically
  integrated business spanning ready-to-wear, couture, fragrance,
  beauty, eyewear, and accessories. The group remains privately
  held by its two founders — figures fluctuate, so verify
  against the latest published accounts before citing.

culturalImpact: |
  Dolce & Gabbana built one of the most identifiable design
  vocabularies in late-twentieth-century Italian fashion by
  drawing, more openly than any peer of comparable scale, on a
  single regional culture — Sicily. The black-lace dress, the
  corset, the leopard print, and the baroque ornament that
  followed entered popular culture through Madonna's <em>Girlie
  Show</em> wardrobe in 1993 and the Hollywood red carpet
  thereafter. The 2018 China incident remains a reference point in
  industry discussions of brand communication and cross-cultural
  marketing. The house's continued joint creative direction by its
  two founders, four decades on, is among the rarest arrangements
  in contemporary luxury.

