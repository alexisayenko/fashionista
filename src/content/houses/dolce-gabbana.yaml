name: Dolce & Gabbana
city: Milan
country: Italy
countryCode: it
founded: 1985

founding: |
  Founded in 1985 in Milan by <strong>Domenico Dolce</strong>
  (b. 1958, Polizzi Generosa, Sicily) and <strong>Stefano Gabbana</strong>
  (b. 1962, Milan), who met working as assistants in a Milanese
  atelier. The pair presented their first runway show as part of
  the <em>Nuovi Talenti</em> group at Milan Fashion Week in
  October 1985 and showed their first solo women's collection the
  following year.

