name: Versace
city: Milan
country: Italy
countryCode: it
founded: 1978

founding: |
  Founded in 1978 in Milan by <strong>Gianni Versace</strong>
  (1946–1997), with his elder brother <strong>Santo Versace</strong>
  steering the business and his younger sister
  <strong>Donatella Versace</strong> joining as muse, image
  director, and eventual heir. Gianni presented his first
  women's collection under his own name in March 1978 at the
  Palazzo della Permanente in Milan.

