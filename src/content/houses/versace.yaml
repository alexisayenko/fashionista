  here because it is an original artistic mark that does not fall
  under PD-textlogo or PD-shape and is not in the public domain.
  Hex values are approximations for editorial illustration; no
  Pantone licensing implied.

milestones:
  - year: 1978
    text: Gianni Versace presents his debut women's collection in Milan; Santo handles the business and Donatella joins as muse and image director.
  - year: 1982
    text: Launch of the metal-mesh fabric <em>Oroton</em>, a chain-mail-like material that becomes a house signature for evening dresses.
  - year: 1992
    text: The <em>Miss S&amp;M</em> autumn–winter collection — bondage harnesses, leather, and gilt buckles — fuses couture craft with overt eroticism.
  - year: 1994
    text: Elizabeth Hurley wears the black silk-and-Lycra <em>safety-pin dress</em> to the London premiere of <em>Four Weddings and a Funeral</em>, generating worldwide press.
  - year: 1997
    text: Gianni Versace is murdered on 15 July outside his Miami Beach residence; <strong>Donatella Versace</strong> takes over as creative director, with Santo as chief executive.
  - year: 2000
    text: Jennifer Lopez wears the green silk-chiffon <em>jungle-print dress</em> to the Grammy Awards; the search volume it generates is widely credited with prompting the creation of Google Images.
  - year: 2018
    text: <strong>Capri Holdings</strong> (then Michael Kors Holdings) agrees to acquire Versace for approximately US$2.1 billion, closing later that year.
  - year: 2025
    text: <strong>Prada Group</strong> agrees to acquire Versace from Capri Holdings for approximately €1.25 billion (announced April 2025); <strong>Donatella Versace</strong> steps down as creative director in March, moving to a chief brand ambassador role, and <strong>Dario Vitale</strong> — formerly of Miu Miu — is named chief creative officer.

creativeDirector: |
  Chief creative officer: <strong>Dario Vitale</strong>, since
  2025, succeeding <strong>Donatella Versace</strong>, who held
  the creative-director role from 1997 to early 2025 and now
  serves as chief brand ambassador. Ownership is transitioning
  from <strong>Capri Holdings</strong> (owner since 2018) to the
  <strong>Prada Group</strong> under the deal agreed in April 2025
  — verify completion status against fresh sources before
  publishing.

volatileNote: Volatile fields — creative leadership and ownership are mid-transition (Vitale appointment 2025, Prada Group acquisition agreed April 2025). Re-verify both lines and the closing status of the Prada deal before publishing.

