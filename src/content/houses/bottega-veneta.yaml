name: Bottega Veneta
city: Vicenza
country: Italy
countryCode: it
founded: 1966

founding: |
  Founded in 1966 in Vicenza, in the Veneto region of north-eastern
  Italy, by <strong>Michele Taddei</strong> and
  <strong>Renzo Zengiaro</strong>. The atelier began as a leather-goods
  workshop drawing on the region's long tradition of artisanal
  tanning and weaving — its name translates simply as "Venetian
  workshop."

