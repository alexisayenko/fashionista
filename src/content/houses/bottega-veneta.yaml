designDna: |
  Quiet luxury before the term existed: a deliberate refusal of
  visible logos, an emphasis on hand-craftsmanship, and a leather
  vocabulary anchored by the <em>intrecciato</em> weave. The
  palette skews to chocolate, black, parakeet green, and the
  fondant creams of the Veneto — colour used architecturally,
  not decoratively. Recognition is meant to come from the hand and
  the eye, not from a monogram.

signatureIntro: A reason to exist beyond a timeline — the pieces that made Bottega Veneta Bottega Veneta.

signaturePieces:
  - name: The <em>intrecciato</em> weave
    year: 1970s–
    text: |
      Narrow strips of nappa leather hand-woven on a wooden frame
      to produce a supple, structured surface that needs no
      hardware to identify it. The technique remains the house's
      defining craft — taught and practised at the
      <em>Scuola della Pelletteria</em> at the Montebello
      atelier, and the source from which most other signature
      pieces descend.

  - name: The Cabat
    year: 2001
    text: |
      A reversible, unlined open tote introduced under Tomas Maier
      and constructed entirely of <em>intrecciato</em> — no
      seams, no hardware, the bag's structure carried by the
      weave alone. Long the house's quiet flagship.

  - name: The Veneta hobo
    text: |
      A soft, slouchy shoulder bag with a single curved strap and
      a body of finely woven nappa — for two decades the most
      recognisable Bottega silhouette and a fixture of the
      celebrity-photographer archive of the 2000s.

  - name: The Knot clutch
    text: |
      A minaudière with a sculptural double-knot closure in
      precious metal, made in <em>intrecciato</em> nappa, satin,
      and exotic skins — the house's evening signature.

  - name: The Pouch
    year: 2019
    text: |
      Daniel Lee's debut hit: an oversized, unstructured clutch
      gathered to look as though it had been crumpled in the
      hand. Widely copied across the contemporary market within
      a season.

  - name: The Cassette
    year: 2020
    text: |
      A small, padded shoulder bag built from chunky woven leather
      — the <em>intrecciato</em> maxi-scale — that became
      the most photographed Bottega bag of Lee's tenure.

  - name: The Lido sandal
    year: 2020
    text: |
      A flat leather sandal whose upper is a single fat woven
      band across the foot — quoted across the high-street
      market almost immediately on release.

  - name: Trompe-l'œil leather tailoring
    year: 2022–
    text: |
      Matthieu Blazy's calling card: a pair of "jeans" and a
      flannel shirt, hand-printed and tooled from leather to
      pass at a glance for cotton — a craft argument made on
      the runway, not in the press notes.

marketPositioning: |
  Ultra-luxury, with the highest price points concentrated in
  leather goods rather than ready-to-wear. The house sits in the
  upper tier of the Kering portfolio alongside Gucci, Saint
  Laurent, and Balenciaga, and competes directly with Hermès on
  craft-led, no-logo positioning.

businessScale: |
  Reported by Kering as a roughly €1.6–1.8 billion annual revenue
  business in recent years, with growth led by leather goods.
  Figures move with each Kering interim; verify against the most
  recent group results before citing.

culturalImpact: |
  Bottega Veneta is the reference point for the contemporary
  "quiet luxury" argument — that recognition can be earned by
  craft rather than by logo. The <em>intrecciato</em> weave is
  among the most-cited examples of protectable trade dress in
  fashion, and the house's tagline of the 1980s —
  <em>"When your own initials are enough"</em> — anticipated
  by four decades the anti-monogram mood that swept luxury in the
  2020s. Under Daniel Lee and Matthieu Blazy in succession, the
  house also became one of the most-discussed runway propositions
  of its generation, with Blazy's leather-as-denim experiments
  cited well outside the trade press.

