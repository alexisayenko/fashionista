trademarkNotice: |
  BOTTEGA VENETA is a trademark of Bottega Veneta S.r.l.
  (Kering group), used here for identification under nominative
  fair use. The house's <em>intrecciato</em> woven leather is a
  protected element of its trade dress and is therefore
  <strong>not visually replicated</strong> on this page — it is
  named and described in prose only. Hex values are
  approximations for editorial illustration; no Pantone
  licensing implied.

milestones:
  - year: 1966
    text: Bottega Veneta is founded in Vicenza by Michele Taddei and Renzo Zengiaro as a small leather-goods atelier.
  - year: 1970s
    text: Introduction of the <em>intrecciato</em> — strips of supple leather hand-woven on a frame — born of a practical solution to the limits of the workshop's sewing machines and quickly adopted as the house signature.
  - year: 1980s
    text: The tagline <em>"When your own initials are enough"</em> articulates the no-logo, recognise-it-by-the-weave positioning that distinguishes the brand from its monogrammed peers.
  - year: 2001
    text: Acquired by the Gucci Group (today <strong>Kering</strong>); <strong>Tomas Maier</strong> is appointed creative director.
  - year: 2001–2018
    text: Maier consolidates the codes — <em>intrecciato</em>, restrained palette, an aesthetic of deliberate quietness — and grows the house into a globally distributed luxury business.
  - year: 2018
    text: <strong>Daniel Lee</strong>, formerly of Céline under Phoebe Philo, succeeds Maier as creative director.
  - year: 2019
    text: A sweep at the British Fashion Awards — Brand of the Year, Designer of the Year, Womenswear Designer, and Accessories Designer — marks Lee's reset of the house silhouette.
  - year: 2021
    text: Lee departs; <strong>Matthieu Blazy</strong> is named creative director.
  - year: 2022–2024
    text: Blazy's collections — most famously the trompe-l'œil leather "denim" and flannel — extend the craft argument into ready-to-wear and earn broad critical acclaim.
  - year: 2024
    text: Blazy departs to lead Chanel; in December, <strong>Louise Trotter</strong> is announced as the next creative director of Bottega Veneta.

creativeDirector: |
  Creative director: <strong>Louise Trotter</strong>, announced
  in December 2024 as the successor to Matthieu Blazy. The house
  has been part of <strong>Kering</strong> since 2001.

volatileNote: Volatile fields — verify the creative-director line and Kering-group structure against fresh sources before publishing.

