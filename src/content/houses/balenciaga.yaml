milestones:
  - year: 1917
    text: Cristóbal Balenciaga opens his first house in San Sebastián, dressing the Spanish royal family and aristocracy.
  - year: 1937
    text: The house relocates to Paris, opening at 10 avenue George V — the address that would become synonymous with the maison.
  - year: 1957
    text: Introduction of the <em>sack</em> dress, followed by the <em>baby-doll</em> and <em>cocoon</em> silhouettes — radical liberations of the female line.
  - year: 1968
    text: Cristóbal closes the couture house, declaring the world that supported it — couture clients, hand-finishing, codes of dress — has ceased to exist.
  - year: 1972
    text: Cristóbal Balenciaga dies on 23 March in Xàbia, Spain.
  - year: 1986
    text: Jacques Bogart S.A. acquires the dormant name and relaunches ready-to-wear, beginning the modern commercial chapter.
  - year: 1997
    text: <strong>Nicolas Ghesquière</strong> is named creative director, restoring critical credibility through a sharp, technically minded modernism over fifteen years.
  - year: 2001
    text: The Gucci Group (later <strong>Kering</strong>) acquires Balenciaga, embedding the house in a multi-brand luxury portfolio.
  - year: 2012
    text: <strong>Alexander Wang</strong> succeeds Ghesquière for a three-year tenure.
  - year: 2015
    text: <strong>Demna</strong> (then styled Demna Gvasalia) is named artistic director, redirecting the house toward provocative streetwear-luxury and conceptual show staging.
  - year: 2022
    text: A November holiday campaign featuring children with plush bear-bag accessories triggers a public crisis; the house apologises, withdraws the imagery, and revises internal review processes.
  - year: 2025
    text: Demna departs to head Gucci; <strong>Pierpaolo Piccioli</strong>, formerly of Valentino, is announced as the new artistic director (per company communications, 2025 — verify before publishing).

creativeDirector: |
  Artistic director: <strong>Pierpaolo Piccioli</strong>, announced
  in 2025 as successor to Demna. Balenciaga has been owned by
  <strong>Kering</strong> (formerly PPR / Gucci Group) since 2001.

volatileNote: Volatile fields — the Demna→Piccioli transition is recent; verify creative-leadership wording and effective dates against fresh sources before publishing.

