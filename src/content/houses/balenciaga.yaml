designDna: |
  Two design grammars in one house. Under Cristóbal: sculptural
  couture cut from the body outward — the cocoon coat, the
  balloon hem, the stand-away collar — engineered through
  mastery of cloth and a famously austere palette. Under Demna:
  the silhouette pushed to confrontation — exaggerated
  shoulders, distressed and oversized streetwear, dystopian show
  staging, and the deliberate erosion of the line between high
  fashion and the everyday. The throughline is volume as argument.

signatureIntro: A reason to exist beyond a timeline — the pieces that made Balenciaga Balenciaga.

signaturePieces:
  - name: The sack dress
    year: 1957
    text: |
      Cristóbal's straight, semi-fitted shift that abolished the
      waist — a quiet rebuke to Dior's hourglass <em>New Look</em>
      and a foundational template for the loose silhouettes that
      followed in the 1960s.

  - name: The cocoon coat
    year: 1950s
    text: |
      Rounded at the back, narrow at the hem, cut so the wearer
      moved inside the garment rather than wearing it close —
      among the clearest statements of the house's sculptural
      approach to volume.

  - name: The City bag
    year: 2001
    text: |
      The slouched, motorcycle-zippered shoulder bag designed under
      Nicolas Ghesquière — the defining "It bag" of the early
      2000s and the commercial engine that funded the house's
      runway ambitions.

  - name: The Triple S sneaker
    year: 2017
    text: |
      The chunky, layered-sole trainer that helped codify the
      "ugly sneaker" wave — a lightning rod for the early-Demna
      era and one of the decade's most-copied silhouettes.

  - name: The Speed trainer
    year: 2017
    text: |
      A sock-knit pull-on with a contoured rubber sole — a
      runway shoe engineered to read as athletic infrastructure
      and price as luxury hardware.

  - name: The Hourglass bag
    year: 2019
    text: |
      A curved-bottom top-handle in shiny calfskin, named for its
      silhouette — Demna's most successful house-coded leather
      good and a deliberate reset of the bag conversation away from
      the City.

  - name: Couture, restored
    year: 2021
    text: |
      The 50th couture collection presented in July 2021 — the
      first since Cristóbal closed the salon in 1968. Staged at
      10 avenue George V, with hand-finished tailoring and gowns
      framed as a re-engagement with the house's founding craft.

  - name: Dystopian show staging
    year: 2020–
    text: |
      Mud-pit runways, snow-globe boxes, simulated war zones, and
      red-carpet stunts — under Demna, the show became as much
      argument as collection, drawing both critical acclaim and
      sustained controversy.

marketPositioning: |
  Ultra-luxury, with an unusually wide aperture — couture and
  hand-finished leather goods at one end, viral footwear and
  graphic merchandise at the other. The strategy concentrates
  cultural attention; the criticism it draws is the price of that
  concentration.

businessScale: |
  A flagship house within Kering's luxury portfolio. Kering does
  not break out Balenciaga revenue separately in its consolidated
  accounts; trade-press estimates have placed the brand on the
  order of one to two billion euros in annual revenue in recent
  years (per analyst reconstructions, treat as estimates).

culturalImpact: |
  Cristóbal was called <em>"the master of us all"</em> by Christian
  Dior — his sculptural cutting shaped the work of Givenchy,
  Courrèges, Ungaro, and a generation beyond. The modern house,
  through Ghesquière and then Demna, became a defining force in
  the 21st-century collapse of the boundary between streetwear and
  luxury, with collaborations and stunts (the Crocs platform, the
  IKEA-bag tote, simulated red-carpet incursions) that read as
  often as performance art as commerce. The 2022 holiday-campaign
  crisis remains the most-discussed reputational event in recent
  Kering history.

