name: Balenciaga
city: San Sebastián
country: Spain
countryCode: es
founded: 1917

founding: |
  Founded in 1917 in San Sebastián by
  <strong>Cristóbal Balenciaga</strong> (1895–1972), a Basque
  tailor's son who opened his first house — <em>Balenciaga y
  Compañía</em> — at the age of twenty-two. Branches followed
  in Madrid and Barcelona; political upheaval at the end of the
  Spanish Civil War pushed Cristóbal to relocate to Paris in
  1937, where the maison de couture at 10 avenue George V
  established the house's enduring identity.

