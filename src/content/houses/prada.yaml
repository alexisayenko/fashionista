name: Prada
city: Milan
country: Italy
countryCode: it
founded: 1913

founding: |
  Founded in 1913 in Milan by brothers
  <strong>Mario Prada</strong> and <strong>Martino Prada</strong>,
  who opened <em>Fratelli Prada</em> as a leather-goods boutique in
  the <em>Galleria Vittorio Emanuele II</em>. The shop sold trunks,
  handbags, and travel accessories to a Milanese clientele and held
  an early royal warrant from the House of Savoy. Mario's
  granddaughter <strong>Miuccia Prada</strong> took over in 1978
  and, with her future husband <strong>Patrizio Bertelli</strong>,
  rebuilt the family firm as a global ready-to-wear house through
  the 1980s and 1990s.

