designDna: |
  Armani's design language is defined by minimalism, precise
  tailoring, muted color palettes, fluid silhouettes, and the absence
  of excessive ornamentation.

signatureIntro: A reason to exist beyond a timeline — the pieces that made Armani Armani.

signaturePieces:
  - name: The unstructured jacket
    year: 1975–
    text: |
      The foundational Armani piece: the men's blazer stripped of
      canvassing and padding, yielding a fluid, shoulder-relaxed
      silhouette that redrew the line of modern tailoring.

  - name: <em>American Gigolo</em> wardrobe
    year: 1980
    text: |
      Richard Gere's on-screen wardrobe for Paul Schrader's film,
      including the closet-scene layout of shirts and jackets —
      the production that launched the house internationally and made
      Armani shorthand for cinematic style.

  - name: The women's power suit
    year: 1980s
    text: |
      A softened take on the men's jacket, cut for women and adopted
      as the defining executive uniform of the decade.

  - name: <em>The Untouchables</em> costumes
    year: 1987
    text: |
      Brian De Palma's prohibition-era film, dressed by Armani and
      credited with reviving the vocabulary of classical menswear on
      screen and off.

  - name: Red-carpet eveningwear
    year: 1990–
    text: |
      Minimalist silk-jersey gowns worn by Michelle Pfeiffer, Jodie
      Foster, Cate Blanchett and others — effectively the
      template for modern celebrity dressing.

  - name: Acqua di Giò
    year: 1996
    text: |
      The Mediterranean-accented men's fragrance that became one of
      the best-selling colognes ever produced.

  - name: Armani Privé
    year: 2005–
    text: |
      The house's Paris-based haute couture line, launched in January
      2005 and worn almost immediately onto the Oscars red carpet.

  - name: The "greige" palette
    text: |
      The greys, beiges and taupes that became shorthand for Armani
      restraint — "quiet luxury" decades before the term existed.

marketPositioning: |
  Positioned across the premium to ultra-luxury segment, Armani
  enjoys strong global brand recognition across menswear, womenswear,
  and lifestyle categories.

businessScale: |
  The Armani Group generates annual revenues on the order of several
  billion euros, reflecting a large-scale, vertically integrated
  fashion business.

culturalImpact: |
  The brand has influenced modern dress codes toward relaxed
  elegance and has engaged in collaborations across cinema, sports,
  and architecture, reinforcing its global lifestyle identity.

