milestones:
  - year: Late 1970s
    text: Introduction of unstructured tailoring that would redefine modern menswear and womenswear.
  - year: 1980s
    text: Rapid international expansion as the house becomes a global symbol of refined Italian style.
  - year: 1981
    text: Launch of <em>Emporio Armani</em>, broadening the group's contemporary reach.
  - year: 1991
    text: Launch of <em>Armani Exchange</em>, addressing the accessible segment.
  - year: 1990s–2000s
    text: Extension into lifestyle sectors including cosmetics, interiors, and hospitality.
  - year: 2025
    text: Giorgio Armani dies on 4 September in Milan, aged 91, ending half a century at the creative and commercial helm of the house he founded.

creativeDirector: |
  The Armani Group was privately owned by Giorgio Armani, who served
  as chairman and chief creative director of the house from its
  founding in 1975 until his death on 4 September 2025.

volatileNote: Post-succession creative leadership and ownership structure to be updated.

