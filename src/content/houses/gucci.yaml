designDna: |
  Equestrian heritage translated into modern luxury: the
  green-red-green webbing, the snaffle bit, the interlocking-GG
  monogram, and the diamond-pattern Diamante canvas form a
  vocabulary built around saddlery, travel, and Florentine leather
  craft. The house oscillates between two registers — pared,
  sensual minimalism and ornate, eclectic maximalism — and its
  most resonant eras (Ford, Michele, De Sarno) have each pushed
  one register to its limit before the pendulum swings back.

signatureIntro: A reason to exist beyond a timeline — the pieces that made Gucci Gucci.

signaturePieces:
  - name: The Bamboo bag
    year: 1947
    text: |
      A structured leather handbag with a single curved handle of
      heat-bent bamboo — a postwar improvisation born of leather
      and metal shortages that became one of the house's enduring
      silhouettes. Reissued continuously since.

  - name: The Horsebit loafer
    year: 1953
    text: |
      A flat-bottom moccasin trimmed with a gilt snaffle-bit
      ornament — the explicit equestrian reference that
      transformed a casual shoe into a global menswear staple,
      worn by bankers, film stars, and, eventually, the Museum of
      Modern Art's permanent collection.

  - name: The green-red-green web
    year: 1960s–
    text: |
      A flat woven stripe drawn from the saddle girth, applied to
      luggage, belts, sneakers, and ready-to-wear. Among the most
      recognisable pieces of trade dress in fashion — and a
      shorthand the house has periodically restrained, then
      revived, with each new creative direction.

  - name: The Jackie bag
    year: 1961
    text: |
      A soft, slouchy hobo with a piston closure, originally sold
      as the <em>Constance</em> and renamed after Jacqueline
      Kennedy Onassis was repeatedly photographed carrying it.
      Reissued under Ford, Giannini, Michele, and again under
      De Sarno.

  - name: The Flora print
    year: 1966
    text: |
      A floral silk-twill scarf reportedly commissioned by Rodolfo
      Gucci for Princess Grace of Monaco, designed by the Roman
      illustrator Vittorio Accornero. The motif — densely
      botanical, faintly art-nouveau — has migrated across
      scarves, ready-to-wear, and leather goods ever since.

  - name: Tom Ford's velvet suit
    year: 1995–2004
    text: |
      The hip-slung trousers, satin shirts, and jewel-toned velvet
      tailoring of Ford's late-1990s collections — a distilled
      vision of grown-up sex appeal that pulled the house out of
      a commercial slump and reset the template for the modern
      luxury creative director.

  - name: Michele's geek-chic wardrobe
    year: 2015–2022
    text: |
      Pussy-bow blouses, oversized pearl-encrusted spectacles,
      embroidered bombers, kitten heels, and the GG Marmont bag —
      a romantic, gender-fluid, magpie aesthetic that drew on
      vintage and bibliographic sources and made Gucci, briefly,
      the most-quoted house in fashion.

  - name: <em>Gucci Ancora</em>
    year: 2023
    text: |
      Sabato De Sarno's debut collection — pared shift dresses,
      shorts suits, and a saturated burgundy he named
      <em>Rosso Ancora</em> — a deliberate counter-swing from
      Michele's maximalism toward quiet, sensual minimalism.

marketPositioning: |
  Ultra-luxury, with a mass-luxury reach unusual in the segment.
  Gucci spans entry-price small leather goods and fragrance through
  high jewellery and made-to-measure, and is consistently among the
  most valuable brands in global rankings.

businessScale: |
  Gucci is the largest brand in the Kering group, generating annual
  revenues on the order of seven to ten billion euros in recent
  years — a band that has narrowed sharply since the 2022 peak.
  Figures move; verify against Kering's latest published accounts
  before citing.

culturalImpact: |
  Few houses have ridden the cycle between minimalism and maximalism
  as visibly as Gucci. Tom Ford's late-1990s tenure rewrote the
  rules of luxury marketing and creative direction; Alessandro
  Michele's 2015–2022 run made the house a touchstone for a
  generation that came of age on Instagram, with collaborations
  spanning <em>The North Face</em>, Balenciaga (the
  <em>Hacker Project</em>), Adidas, and Disney. The house's
  cultural footprint extends through cinema (Ridley Scott's
  <em>House of Gucci</em>, 2021), music (Harry Styles's tailoring,
  Jared Leto's red-carpet appearances), and a thicket of
  watch-store, sneaker, and streetwear scandals that continue to
  shape how luxury is debated online.
