name: Gucci
city: Florence
country: Italy
countryCode: it
founded: 1921

founding: |
  Founded in 1921 in Florence by <strong>Guccio Gucci</strong>
  (1881–1953), who opened a small leather-goods shop on
  Via della Vigna Nuova after a stint as a porter at London's Savoy
  Hotel — an exposure to the luggage of well-travelled clientele
  said to have shaped his eye for refined saddlery and fine
  craftsmanship. The atelier built its reputation on
  equestrian-inflected leather goods through the 1930s and expanded
  internationally after the Second World War.

