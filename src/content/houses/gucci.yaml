milestones:
  - year: 1921
    text: Guccio Gucci opens his leather-goods shop in Florence, anchored in equestrian craftsmanship.
  - year: 1947
    text: Introduction of the <em>Bamboo bag</em>, its curved handle a response to wartime material shortages and an enduring house signature.
  - year: 1953
    text: Founder's death, weeks after the opening of the New York flagship; sons Aldo, Vasco, Ugo, and Rodolfo inherit the business.
  - year: 1953
    text: Debut of the <em>Horsebit loafer</em>, a flat-bottom moccasin trimmed with a snaffle-bit ornament that becomes a permanent fixture of menswear.
  - year: 1960s
    text: Adoption of the green-red-green webbing — drawn from the saddle girth — and the interlocking-GG monogram as house insignia.
  - year: 1961
    text: Launch of the <em>Jackie</em> hobo bag, later named for Jacqueline Kennedy Onassis, who carried it through the decade.
  - year: 1990s
    text: <strong>Tom Ford</strong>, appointed creative director in 1994, repositions the house around overt sensuality and modern glamour, restoring its commercial fortunes.
  - year: 2004
    text: Ford and chief executive Domenico De Sole exit; <strong>Frida Giannini</strong> later assumes creative direction across the house.
  - year: 2015
    text: <strong>Alessandro Michele</strong> is named creative director, ushering in a maximalist, gender-fluid, romantic register that defines the brand for nearly a decade.
  - year: 2023
    text: <strong>Sabato De Sarno</strong>, formerly of Valentino, succeeds Michele with a stripped-back, sensual minimalism debuted in his <em>Gucci Ancora</em> collection.
  - year: 2025
    text: De Sarno departs after roughly two years; <strong>Demna</strong>, formerly of Balenciaga, is announced as artistic director.

creativeDirector: |
  Artistic director: <strong>Demna</strong>, announced in 2025.
  Gucci is the flagship house of <strong>Kering</strong>, the
  Paris-listed luxury group controlled by the Pinault family
  through Artémis.

volatileNote: Volatile fields — verify creative-director and ownership lines against fresh sources before publishing.

