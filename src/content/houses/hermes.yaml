name: Hermès
city: Paris
country: France
countryCode: fr
founded: 1837

founding: |
  Founded in 1837 in Paris by <strong>Thierry Hermès</strong>
  (1801–1878) as a harness workshop in the Grands Boulevards quarter,
  outfitting the carriages of European nobility. The house migrated
  from the bridle to the saddle under his son Charles-Émile, and to
  the trunk, the bag, and the silk square under successive
  generations — a lineage that has remained, unusually for the
  sector, in family hands.

