trademarkNotice: |
  HERMÈS and the <em>Duc-carriage-and-horse</em> device are
  trademarks of Hermès International, used here for identification
  under nominative fair use. Source file via Wikimedia —
  <a href="https://commons.wikimedia.org/wiki/File:Herm%C3%A8s_logo.svg">wordmark</a>
  (PD-textlogo, Wikimedia Commons). Hex values — including the
  signature orange — are approximations for editorial illustration;
  no Pantone licensing implied. Hermès does not hold a registered
  single-colour trademark on the orange.

milestones:
  - year: 1837
    text: Thierry Hermès opens a harness workshop in Paris, supplying European courts and the carriage trade.
  - year: 1880
    text: Charles-Émile Hermès moves the house to <em>24 rue du Faubourg Saint-Honoré</em>, still its flagship address, and pivots from harness to saddlery.
  - year: 1922
    text: Émile-Maurice Hermès introduces leather goods and travel articles, having brought the zipper — the <em>fermeture Hermès</em> — back from a North-American visit.
  - year: 1937
    text: Launch of the <em>carré</em>, the 90 × 90 cm screen-printed silk scarf that becomes a cultural object in its own right.
  - year: 1956
    text: Grace Kelly is photographed shielding her pregnancy with the <em>Sac à dépêches</em>; <em>Life</em> magazine's caption rebaptises it the <strong>Kelly</strong>.
  - year: 1978
    text: <strong>Jean-Louis Dumas</strong> takes the helm and steers the house through three decades of measured expansion without diluting its codes.
  - year: 1984
    text: Birth of the <strong>Birkin</strong>, named for Jane Birkin after a chance flight conversation with Dumas.
  - year: 1993
    text: Hermès International is listed on the Paris Bourse; the founding family retains majority control.
  - year: 2010–2014
    text: LVMH discloses a 17% stake built through equity swaps; after a long battle, an accord distributes the shares to family members and the holding <em>H51</em> is formed to lock in family control.
  - year: 2014
    text: <strong>Axel Dumas</strong> is named executive chairman, the sixth generation of the family at the helm.
  - year: 2024
    text: Group revenues surpass <strong>€15 billion</strong>, with operating margins among the highest in the listed luxury sector.

creativeDirector: |
  Artistic director of women's ready-to-wear:
  <strong>Nadège Vanhée</strong>, since 2014.
  Artistic director of men's ready-to-wear:
  <strong>Véronique Nichanian</strong>, since 1988 — one of the
  longest tenures in the industry. Executive chairman:
  <strong>Axel Dumas</strong>; the Hermès family retains majority
  control through the <em>H51</em> holding company. Verify against
  fresh sources before publishing — leadership at this level moves
  slowly but does move.

