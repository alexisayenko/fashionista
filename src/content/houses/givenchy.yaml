founding: |
  Founded in February 1952 in Paris by
  <strong>Hubert de Givenchy</strong> (1927–2018), an
  aristocrat-turned-couturier who had trained under Jacques Fath,
  Robert Piguet, Lucien Lelong, and Elsa Schiaparelli before opening
  his own house at 8 rue Alfred de Vigny at the age of twenty-four.

