milestones:
  - year: 1952
    text: Debut collection in Paris introduces the <em>Bettina</em> blouse — a white shirting piece with ruffled broderie-anglaise sleeves, named for the model Bettina Graziani — which becomes the season's most-copied silhouette.
  - year: 1953
    text: First meeting with <strong>Audrey Hepburn</strong> on the set of <em>Sabrina</em>; the encounter begins a four-decade collaboration and friendship that defines the house's public image.
  - year: 1957
    text: Launch of <em>L'Interdit</em>, reportedly created for Hepburn — among the earliest fragrances expressly tied to a single muse.
  - year: 1961
    text: Hepburn wears the floor-length black sheath designed by Givenchy in the opening sequence of <em>Breakfast at Tiffany's</em> — a little black dress that becomes the most-cited LBD of the second half of the twentieth century.
  - year: 1988
    text: <strong>LVMH</strong> acquires the house, ending Hubert de Givenchy's independent ownership while he remains in charge of design.
  - year: 1995
    text: Hubert de Givenchy retires; <strong>John Galliano</strong> is appointed creative director for a single year before moving to Dior.
  - year: 1996–2001
    text: <strong>Alexander McQueen</strong> directs the house, including its haute couture, bringing a darker, more confrontational vocabulary that sits uneasily alongside the founder's restraint.
  - year: 2005–2017
    text: <strong>Riccardo Tisci</strong>'s twelve-year tenure reorients Givenchy toward streetwear-luxe, religious iconography, and a celebrated menswear practice — the Rottweiler tee and the studded sneakers among its commercial signatures.
  - year: 2017–2020
    text: <strong>Clare Waight Keller</strong> is creative director; in May 2018 she designs the wedding gown of <strong>Meghan Markle, Duchess of Sussex</strong>, returning the house to global front-page visibility.
  - year: 2020–2024
    text: <strong>Matthew M. Williams</strong> leads the house, importing a hardware-forward streetwear sensibility from his label 1017 ALYX 9SM.
  - year: 2018
    text: Hubert de Givenchy dies on 10 March, aged 91.
  - year: 2024
    text: <strong>Sarah Burton</strong>, formerly of Alexander McQueen, is announced as creative director, with her debut collection presented in Paris in March 2025.

