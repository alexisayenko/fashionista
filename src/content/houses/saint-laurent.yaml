name: Saint Laurent
city: Paris
country: France
countryCode: fr
founded: 1961

founding: |
  Founded in 1961 in Paris by <strong>Yves Saint Laurent</strong>
  (1936–2008) and his partner <strong>Pierre Bergé</strong>
  (1930–2017), shortly after Saint Laurent's departure from the
  House of Dior. The first couture collection was shown in
  January 1962 at 30 bis rue Spontini.

