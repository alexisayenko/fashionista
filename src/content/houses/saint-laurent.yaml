milestones:
  - year: 1962
    text: First couture collection presented at 30 bis rue Spontini, Paris.
  - year: 1965
    text: The <em>Mondrian</em> dress — wool-jersey shifts blocked in primary colours after Piet Mondrian's grids — defines the autumn collection.
  - year: 1966
    text: <em>Le Smoking</em> — a tuxedo cut for women — debuts, recasting menswear tailoring as eveningwear for women.
  - year: 1966
    text: Launch of <em>Saint Laurent Rive Gauche</em>, one of the earliest designer ready-to-wear lines, opening on rue de Tournon.
  - year: 1968
    text: The see-through chiffon blouse and the safari jacket establish the house's sensual, utility-borrowed vocabulary.
  - year: 1983
    text: The Metropolitan Museum of Art mounts a retrospective of Saint Laurent's work — the first such honour for a living designer.
  - year: 1999
    text: The Gucci Group (later PPR, now Kering) acquires Yves Saint Laurent; <strong>Tom Ford</strong> takes over ready-to-wear while Saint Laurent retains couture.
  - year: 2002
    text: Yves Saint Laurent retires; the couture house closes with a January farewell show at the Centre Pompidou.
  - year: 2004–2012
    text: <strong>Stefano Pilati</strong> leads ready-to-wear, drawing on the archive with a softer, more architectural hand.
  - year: 2012
    text: <strong>Hedi Slimane</strong> takes creative control, renames the ready-to-wear line <em>Saint Laurent</em> (dropping "Yves" for fashion only), and resets the visual identity around a rock'n'roll Parisian silhouette.
  - year: 2016
    text: <strong>Anthony Vaccarello</strong> succeeds Slimane as creative director.
  - year: 2017
    text: Pierre Bergé dies on 8 September; the Fondation Pierre Bergé–Yves Saint Laurent opens museums devoted to the archive in Paris and Marrakech.

creativeDirector: |
  Creative director: <strong>Anthony Vaccarello</strong>, since
  April 2016. The house is owned by <strong>Kering</strong>, the
  French luxury group, which acquired it as part of Gucci Group in
  1999.

volatileNote: Volatile fields — verify creative-director and ownership lines against fresh sources before publishing.

