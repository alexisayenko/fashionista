designDna: |
  <em>Le smoking</em> and the sharp shoulder — a rock'n'roll
  Parisian language built on borrowed menswear, transparent black,
  and the long, lean leg. Tailoring is precise and sexual rather
  than soft; eveningwear leans on jet, sequin, and the cut of a
  tuxedo lapel. The codes are reductive — black, white, gold —
  punctuated by the bourgeois colour-blocks of the founder's
  archive (<em>Mondrian</em>, the Russian collection, the
  ballet-inspired pieces).

signatureIntro: A reason to exist beyond a timeline — the pieces that made Saint Laurent Saint Laurent.

signaturePieces:
  - name: Le Smoking
    year: 1966
    text: |
      The women's tuxedo — a black wool-and-satin dinner suit
      cut to the female body. Helmut Newton's 1975 photograph of
      a model smoking on a Paris street, shot for French
      <em>Vogue</em>, fixed it in the cultural imagination as a
      study in androgyny, power, and Parisian cool.

  - name: The Mondrian dress
    year: 1965
    text: |
      Sleeveless wool-jersey shifts colour-blocked after Piet
      Mondrian's <em>Composition</em> grids — primary red, blue,
      yellow, and white separated by black bands. The seams hide
      the construction so the painting reads cleanly across the
      body.

  - name: The safari jacket
    year: 1968
    text: |
      A four-pocket bush jacket in cotton gabardine with a corded
      belt — utility wear pulled out of its colonial context and
      cut for the boulevard.

  - name: The see-through blouse
    year: 1968
    text: |
      A long-sleeved blouse in transparent black chiffon, worn
      with a black skirt and an ostrich-feather belt — among the
      most-cited single garments of the late 1960s for its
      uncovered upper body.

  - name: The peasant collection
    year: 1976
    text: |
      The autumn-winter <em>Opéra–Ballets Russes</em> collection
      — full skirts, gold braid, embroidered boleros — that
      <em>The New York Times</em> called a revolution. The opulent
      counterpoint to the tuxedo.

  - name: Opium
    year: 1977
    text: |
      The spice-and-resin oriental fragrance whose orientalist
      name and launch campaign provoked controversy on release —
      and went on to become one of the bestselling perfumes of
      its decade.

  - name: The Sac de Jour
    year: 2013
    text: |
      A structured, top-handle calfskin tote introduced under Hedi
      Slimane — clean lines, padlock detail, an assertive
      silhouette built to anchor the house's reset leather-goods
      vocabulary.

  - name: The Tribute sandal
    year: 2008
    text: |
      A platform sandal with crossed leather straps that became,
      across two creative directors, a fixture of red-carpet
      dressing and the most enduring Saint Laurent shoe of the
      twenty-first century.

marketPositioning: |
  Ultra-luxury. Saint Laurent sits at the top of Kering's fashion
  portfolio alongside Gucci and Bottega Veneta, with leather goods,
  ready-to-wear, and footwear priced into the upper luxury tier
  and a beauty-and-fragrance business licensed to L'Oréal.

businessScale: |
  Saint Laurent is one of Kering's largest brands by revenue,
  reporting on the order of three billion euros in recent years,
  with strong growth through the Vaccarello era. Figures move;
  verify against Kering's latest published accounts before citing.

culturalImpact: |
  Yves Saint Laurent is widely credited with translating
  twentieth-century menswear — the tuxedo, the safari jacket,
  the trench, the pea coat — into a women's wardrobe, and with
  legitimising ready-to-wear as a designer category through
  <em>Rive Gauche</em>. He was among the first couturiers to cast
  women of colour on the Paris runway and to draw openly on
  non-Western visual traditions, a body of work the
  Fondation Pierre Bergé–Yves Saint Laurent now stewards through
  museums in Paris and Marrakech. Under Slimane and Vaccarello,
  the house has become a defining reference for contemporary
  rock'n'roll tailoring and a fixture of red-carpet and music-led
  cultural moments.

